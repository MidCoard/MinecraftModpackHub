name: Verify and package Minecraft tools
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=768
      GOMAXPROCS: "1"
      UV_THREADPOOL_SIZE: "1"
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --depth=1 origin "$SOURCE_COMMIT"
          git switch --detach FETCH_HEAD
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npx --yes pnpm@7.33.7 install --frozen-lockfile
      - name: Verify behavior and build site
        run: |
          npm test
          npm run build
      - name: Package static site
        run: |
          mkdir -p delivery
          python3 -m zipfile --create delivery/site.zip dist/index.html dist/assets dist/modpacks dist/factory dist/fonts dist/art dist/mark.svg dist/credits.txt
          if git check-ignore delivery/site.zip; then
            echo 'The delivery artifact must be explicitly allowed before upload.'
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minecraft-tools-${{ github.sha }}
          path: delivery/site.zip
          if-no-files-found: error
          retention-days: 7
